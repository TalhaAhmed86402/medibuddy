[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medibuddy-bench"
version = "1.1.0"          # keep equal to medibuddy_bench.VERSION (tests/test_packaging.py checks it)
description = "Benchmark for agents that help international residents of Korea choose a hospital, interpret a visit, summarise it and remember preferences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # the benchmark core uses only the Python standard library

[project.optional-dependencies]
a2a = ["a2a-sdk[http-server]==0.3.26", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
medibuddy = "medibuddy_bench.cli:main"

[tool.setuptools.packages.find]
include = ["medibuddy_bench*"]
