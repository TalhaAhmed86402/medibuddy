# Publishes the benchmark image to GitHub Container Registry when a version tag is pushed (git tag v1.2.0 && git push --tags).
# AgentBeats (and anyone else) can then run ghcr.io/<owner>/medibuddy-bench:<version> without building it.
# The image contains only the public splits (data/lite, data/dev); the hidden split is mounted at run time, never baked in.
name: publish-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag must match the data version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import medibuddy_bench; print(medibuddy_bench.VERSION)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != VERSION $v"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/medibuddy-bench" >> "$GITHUB_OUTPUT"
      - name: build (the Dockerfile verifies the data at build time)
        run: docker build --platform linux/amd64 -t "${{ steps.meta.outputs.repo }}:latest" .
      - name: smoke test inside the image
        run: |
          docker run --rm "${{ steps.meta.outputs.repo }}:latest" run --agent oracle --data data/lite --no-transcripts | grep "Overall (gated): 100.0"
      - name: build the reference purple agent image (AgentBeats tests)
        run: |
          docker build --platform linux/amd64 -f agentbeats/Dockerfile.purple \
            --build-arg BASE="${{ steps.meta.outputs.repo }}:latest" -t "${{ steps.meta.outputs.repo }}-purple:latest" .
      - name: push
        run: |
          for r in "${{ steps.meta.outputs.repo }}" "${{ steps.meta.outputs.repo }}-purple"; do
            if [[ "${GITHUB_REF_NAME}" == v* ]]; then docker tag "$r:latest" "$r:${GITHUB_REF_NAME#v}"; docker push "$r:${GITHUB_REF_NAME#v}"; fi
            docker push "$r:latest"
          done
