# Proves, on every push, that the benchmark behaves the same on Linux, macOS and Windows and that the Docker image builds.
name: CI
on: [push, pull_request]

jobs:
  core:                                  # standard library only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - run: python -m medibuddy_bench verify --data data/dev
      - run: python -m medibuddy_bench run --agent oracle --data data/lite --no-transcripts
      - run: python scripts/baselines_report.py --check       # baseline tables match the run records

  a2a:                                   # the A2A service with its pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements-a2a.lock pytest
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medibuddy-bench .
      - run: docker run --rm medibuddy-bench doctor
      - name: oracle must score 100 inside the container
        run: |
          docker run --rm medibuddy-bench run --agent oracle --data data/lite --no-transcripts | grep "Overall (gated): 100.0"
